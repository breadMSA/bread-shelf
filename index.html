  <body>
    <div id="app"></div>
    <script src="assets/author-config.js?v=20260730-2"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js?v=4"));
      }
      // Story data changes independently of the site shell. Use a fresh URL on
      // each visit so readers never remain on an older GitHub Pages cache.
      const storyData = document.createElement("script");
      storyData.src = `data/stories.js?published=${Date.now()}`;
      storyData.onload = () => {
        const app = document.createElement("script");
        app.src = "assets/app.js?v=20260801-3";
        app.onload = () => {
          const ux = document.createElement("script");
          ux.src = "assets/ux-fixes.js?v=20260730-3";
          document.body.append(ux);
        };
        document.body.append(app);
      };
      document.body.append(storyData);
    </script>
  </body>
